<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日饮食热量计算器</title>
<style>
  :root {
    --primary: #4CAF50;
    --primary-dark: #388E3C;
    --accent: #FF9800;
    --danger: #f44336;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #333333;
    --text-light: #777777;
    --border: #e0e0e0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  header {
    text-align: center;
    padding: 30px 0 20px;
  }

  header h1 {
    font-size: 28px;
    color: var(--primary-dark);
    margin-bottom: 6px;
  }

  header p {
    color: var(--text-light);
    font-size: 14px;
  }

  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }

  .card h2 {
    font-size: 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 食物选择区域 */
  .food-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .food-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .food-item:hover {
    border-color: var(--primary);
    background: #f0faf0;
  }

  .food-item.selected {
    border-color: var(--primary);
    background: #e8f5e9;
  }

  .food-item .emoji {
    font-size: 24px;
    flex-shrink: 0;
  }

  .food-item .info {
    flex: 1;
    min-width: 0;
  }

  .food-item .name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .food-item .cal {
    font-size: 11px;
    color: var(--text-light);
  }

  /* 已选食物列表 */
  .selected-list {
    width: 100%;
    border-collapse: collapse;
  }

  .selected-list th {
    text-align: left;
    padding: 10px 12px;
    background: #f9f9f9;
    font-size: 13px;
    color: var(--text-light);
    font-weight: 600;
    border-bottom: 2px solid var(--border);
  }

  .selected-list td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }

  .selected-list tr:last-child td {
    border-bottom: none;
  }

  .selected-list .amount-input {
    width: 70px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    text-align: center;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .selected-list .amount-input:focus {
    border-color: var(--primary);
  }

  .btn-remove {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
  }

  .btn-remove:hover {
    background: #ffebee;
  }

  .empty-msg {
    text-align: center;
    padding: 30px;
    color: var(--text-light);
    font-size: 14px;
  }

  /* 手动添加食物 */
  .add-form {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-group label {
    font-size: 12px;
    color: var(--text-light);
    font-weight: 600;
  }

  .form-group input {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    border-color: var(--primary);
  }

  .btn-add {
    padding: 8px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s;
    white-space: nowrap;
    height: 38px;
  }

  .btn-add:hover {
    background: #F57C00;
  }

  /* 汇总面板 */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }

  .summary-item {
    text-align: center;
    padding: 16px;
    background: linear-gradient(135deg, #f5f5f5, #ffffff);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .summary-item .value {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary-dark);
  }

  .summary-item .value.calories {
    color: var(--danger);
  }

  .summary-item .label {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 4px;
  }

  .summary-item .unit {
    font-size: 14px;
    font-weight: 400;
  }

  /* 清空按钮 */
  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
    gap: 10px;
  }

  .btn-clear {
    padding: 8px 20px;
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s;
  }

  .btn-clear:hover {
    background: #d32f2f;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--text-light);
    font-size: 12px;
  }

  /* 响应式 */
  @media (max-width: 700px) {
    .add-form {
      grid-template-columns: 1fr 1fr;
    }
    .food-grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }
    .summary-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 480px) {
    .container { padding: 12px; }
    header h1 { font-size: 22px; }
    .card { padding: 16px; }
    .add-form {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🍱 每日饮食热量计算器</h1>
    <p>选择或添加今天吃的食物，自动计算营养摄入</p>
  </header>

  <!-- 常见食物选择 -->
  <div class="card">
    <h2>📋 常见食物（点击选择）</h2>
    <div class="food-grid" id="foodGrid"></div>
  </div>

  <!-- 手动添加食物 -->
  <div class="card">
    <h2>➕ 手动添加食物</h2>
    <div class="add-form">
      <div class="form-group">
        <label>食物名称</label>
        <input type="text" id="customName" placeholder="如：牛肉面">
      </div>
      <div class="form-group">
        <label>热量 (kcal/100g)</label>
        <input type="number" id="customCalories" placeholder="350">
      </div>
      <div class="form-group">
        <label>蛋白质 (g/100g)</label>
        <input type="number" id="customProtein" placeholder="12">
      </div>
      <div class="form-group">
        <label>碳水 (g/100g)</label>
        <input type="number" id="customCarbs" placeholder="45">
      </div>
      <div class="form-group">
        <label>脂肪 (g/100g)</label>
        <input type="number" id="customFat" placeholder="8">
      </div>
      <button class="btn-add" onclick="addCustomFood()">添加</button>
    </div>
  </div>

  <!-- 已选食物 -->
  <div class="card">
    <h2>🥗 今日已选食物</h2>
    <div id="selectedArea">
      <div class="empty-msg">还没有选择食物，点击上方食物卡片开始记录吧~</div>
    </div>
    <div class="actions" id="actionsArea" style="display:none;">
      <button class="btn-clear" onclick="clearAll()">🗑️ 清空全部</button>
    </div>
  </div>

  <!-- 营养汇总 -->
  <div class="card">
    <h2>📊 今日营养摄入汇总</h2>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="value calories" id="totalCalories">0</div>
        <div class="label">总热量 (kcal)</div>
      </div>
      <div class="summary-item">
        <div class="value" id="totalProtein">0</div>
        <div class="label">蛋白质 (g)</div>
      </div>
      <div class="summary-item">
        <div class="value" id="totalCarbs">0</div>
        <div class="label">碳水化合物 (g)</div>
      </div>
      <div class="summary-item">
        <div class="value" id="totalFat">0</div>
        <div class="label">脂肪 (g)</div>
      </div>
      <div class="summary-item">
        <div class="value" id="totalFiber">0</div>
        <div class="label">膳食纤维 (g)</div>
      </div>
    </div>
  </div>

  <footer>
    数据仅供参考，实际营养含量因烹饪方式和食材差异可能有所不同。
  </footer>
</div>

<script>
// 预设10种中国人最常见的食物（每100g的营养数据）
const presetFoods = [
  { name: "米饭（熟）", emoji: "🍚", calories: 116, protein: 2.6, carbs: 25.6, fat: 0.3, fiber: 0.3 },
  { name: "馒头",       emoji: "🫓", calories: 221, protein: 7.0, carbs: 45.7, fat: 1.1, fiber: 1.3 },
  { name: "面条（熟）", emoji: "🍜", calories: 110, protein: 3.4, carbs: 22.5, fat: 0.5, fiber: 0.8 },
  { name: "鸡蛋（煮）", emoji: "🥚", calories: 144, protein: 13.3, carbs: 1.5, fat: 8.8, fiber: 0   },
  { name: "猪肉（瘦）", emoji: "🥩", calories: 143, protein: 20.3, carbs: 1.5, fat: 6.2, fiber: 0   },
  { name: "鸡胸肉",     emoji: "🍗", calories: 133, protein: 19.4, carbs: 2.5, fat: 5.0, fiber: 0   },
  { name: "豆腐",       emoji: "🧈", calories: 81,  protein: 8.1, carbs: 4.2, fat: 3.7, fiber: 0.4 },
  { name: "西红柿",     emoji: "🍅", calories: 19,  protein: 0.9, carbs: 3.5, fat: 0.2, fiber: 0.5 },
  { name: "白菜",       emoji: "🥬", calories: 17,  protein: 1.5, carbs: 2.2, fat: 0.2, fiber: 0.8 },
  { name: "牛奶",       emoji: "🥛", calories: 54,  protein: 3.0, carbs: 3.4, fat: 3.2, fiber: 0   },
];

// 所有可用食物（含预设 + 用户添加）
let allFoods = [...presetFoods];

// 已选食物列表 [{food, amount}]
let selectedFoods = [];

// 从 localStorage 恢复用户自定义食物
function loadCustomFoods() {
  try {
    const saved = localStorage.getItem("customFoods");
    if (saved) {
      const customs = JSON.parse(saved);
      allFoods = [...presetFoods, ...customs];
    }
  } catch(e) {}
}

function saveCustomFoods() {
  const customs = allFoods.slice(presetFoods.length);
  localStorage.setItem("customFoods", JSON.stringify(customs));
}

// 渲染食物选择网格
function renderFoodGrid() {
  const grid = document.getElementById("foodGrid");
  grid.innerHTML = "";
  allFoods.forEach((food, idx) => {
    const isSelected = selectedFoods.some(s => s.foodIdx === idx);
    const div = document.createElement("div");
    div.className = "food-item" + (isSelected ? " selected" : "");
    div.onclick = () => toggleFood(idx);
    div.innerHTML = `
      <span class="emoji">${food.emoji}</span>
      <div class="info">
        <div class="name">${food.name}</div>
        <div class="cal">${food.calories} kcal/100g</div>
      </div>
    `;
    grid.appendChild(div);
  });
}

// 切换食物选择
function toggleFood(idx) {
  const existIdx = selectedFoods.findIndex(s => s.foodIdx === idx);
  if (existIdx >= 0) {
    selectedFoods.splice(existIdx, 1);
  } else {
    selectedFoods.push({ foodIdx: idx, amount: 100 });
  }
  render();
}

// 渲染已选列表
function renderSelectedList() {
  const area = document.getElementById("selectedArea");
  const actions = document.getElementById("actionsArea");

  if (selectedFoods.length === 0) {
    area.innerHTML = '<div class="empty-msg">还没有选择食物，点击上方食物卡片开始记录吧~</div>';
    actions.style.display = "none";
    return;
  }

  actions.style.display = "flex";

  let html = `<table class="selected-list">
    <thead>
      <tr>
        <th>食物</th>
        <th>数量 (g)</th>
        <th>热量</th>
        <th>蛋白质</th>
        <th>碳水</th>
        <th>脂肪</th>
        <th></th>
      </tr>
    </thead>
    <tbody>`;

  selectedFoods.forEach((item, i) => {
    const food = allFoods[item.foodIdx];
    const ratio = item.amount / 100;
    html += `<tr>
      <td>${food.emoji} ${food.name}</td>
      <td><input class="amount-input" type="number" min="0" value="${item.amount}" onchange="updateAmount(${i}, this.value)" oninput="updateAmount(${i}, this.value)"></td>
      <td>${(food.calories * ratio).toFixed(0)} kcal</td>
      <td>${(food.protein * ratio).toFixed(1)} g</td>
      <td>${(food.carbs * ratio).toFixed(1)} g</td>
      <td>${(food.fat * ratio).toFixed(1)} g</td>
      <td><button class="btn-remove" onclick="removeFood(${i})">✕</button></td>
    </tr>`;
  });

  html += `</tbody></table>`;
  area.innerHTML = html;
}

// 更新数量
function updateAmount(i, val) {
  selectedFoods[i].amount = parseFloat(val) || 0;
  renderSelectedList();
  renderSummary();
}

// 移除食物
function removeFood(i) {
  selectedFoods.splice(i, 1);
  render();
}

// 清空全部
function clearAll() {
  selectedFoods = [];
  render();
}

// 渲染汇总
function renderSummary() {
  let totalCal = 0, totalPro = 0, totalCarb = 0, totalFat = 0, totalFib = 0;

  selectedFoods.forEach(item => {
    const food = allFoods[item.foodIdx];
    const ratio = item.amount / 100;
    totalCal  += food.calories * ratio;
    totalPro  += food.protein * ratio;
    totalCarb += food.carbs * ratio;
    totalFat  += food.fat * ratio;
    totalFib  += (food.fiber || 0) * ratio;
  });

  document.getElementById("totalCalories").textContent = totalCal.toFixed(0);
  document.getElementById("totalProtein").textContent  = totalPro.toFixed(1);
  document.getElementById("totalCarbs").textContent    = totalCarb.toFixed(1);
  document.getElementById("totalFat").textContent      = totalFat.toFixed(1);
  document.getElementById("totalFiber").textContent    = totalFib.toFixed(1);
}

// 手动添加食物
function addCustomFood() {
  const name     = document.getElementById("customName").value.trim();
  const calories = parseFloat(document.getElementById("customCalories").value);
  const protein  = parseFloat(document.getElementById("customProtein").value) || 0;
  const carbs    = parseFloat(document.getElementById("customCarbs").value) || 0;
  const fat      = parseFloat(document.getElementById("customFat").value) || 0;

  if (!name) { alert("请输入食物名称"); return; }
  if (isNaN(calories) || calories <= 0) { alert("请输入有效的热量值"); return; }

  const newFood = { name, emoji: "🍽️", calories, protein, carbs, fat, fiber: 0 };
  allFoods.push(newFood);
  saveCustomFoods();

  // 自动选中并添加到已选列表
  selectedFoods.push({ foodIdx: allFoods.length - 1, amount: 100 });

  // 清空表单
  document.getElementById("customName").value = "";
  document.getElementById("customCalories").value = "";
  document.getElementById("customProtein").value = "";
  document.getElementById("customCarbs").value = "";
  document.getElementById("customFat").value = "";

  render();
}

// 统一渲染
function render() {
  renderFoodGrid();
  renderSelectedList();
  renderSummary();
}

// 初始化
loadCustomFoods();
render();
</script>
</body>
</html>
