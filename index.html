<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>每日饮食热量计算器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">
<style>
  :root {
    --primary: #10b981;
    --primary-light: #d1fae5;
    --primary-dark: #059669;
    --accent: #f59e0b;
    --accent-light: #fef3c7;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --info: #3b82f6;
    --info-light: #dbeafe;
    --purple: #8b5cf6;
    --purple-light: #ede9fe;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow: 0 4px 20px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
    --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    padding-bottom: var(--safe-bottom);
  }

  /* ===== Header ===== */
  .hero {
    background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
    padding: 48px 20px 60px;
    padding-top: calc(48px + var(--safe-top));
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
  }

  .hero h1 {
    font-size: 32px;
    font-weight: 800;
    color: white;
    margin-bottom: 8px;
    position: relative;
    letter-spacing: -0.5px;
  }

  .hero p {
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    position: relative;
  }

  /* ===== Container ===== */
  .container {
    max-width: 1080px;
    margin: -30px auto 0;
    padding: 0 16px 40px;
    position: relative;
    z-index: 1;
  }

  /* ===== Summary Bar (sticky) ===== */
  .summary-bar {
    background: rgba(255,255,255,0.95);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 16px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.6);
  }

  .summary-item {
    text-align: center;
    position: relative;
  }

  .summary-item::after {
    content: '';
    position: absolute;
    right: -4px;
    top: 15%;
    height: 70%;
    width: 1px;
    background: var(--border);
  }

  .summary-item:last-child::after { display: none; }

  .summary-item .value {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }

  .summary-item .value.calories {
    background: linear-gradient(135deg, #dc2626, #ef4444);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .summary-item .label {
    font-size: 10px;
    color: var(--text-light);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }

  /* ===== Card ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(0,0,0,0.03);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .card-header h2 {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }

  .card-header h2 .icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-xs);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .icon-green  { background: var(--primary-light); }
  .icon-orange { background: var(--accent-light); }
  .icon-blue   { background: var(--info-light); }
  .icon-purple { background: var(--purple-light); }

  /* ===== Search ===== */
  .search-bar {
    position: relative;
    width: 100%;
    flex-shrink: 0;
  }

  .search-bar input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 16px; /* 16px 防止 iOS 自动缩放 */
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    background: #f8fafc;
    -webkit-appearance: none;
    appearance: none;
  }

  .search-bar input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
    background: white;
  }

  .search-bar .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 15px;
    pointer-events: none;
  }

  /* ===== Category Tabs ===== */
  .category-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 4px;
    scroll-snap-type: x proximity;
  }

  .category-tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    padding: 8px 16px;
    border: 2px solid var(--border);
    border-radius: 50px;
    background: white;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    flex-shrink: 0;
    scroll-snap-align: start;
    -webkit-appearance: none;
    appearance: none;
  }

  .tab-btn:active {
    transform: scale(0.95);
  }

  .tab-btn.active {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
  }

  .tab-btn .tab-count {
    display: inline-block;
    background: rgba(0,0,0,0.08);
    padding: 1px 6px;
    border-radius: 20px;
    font-size: 11px;
    margin-left: 3px;
  }

  .tab-btn.active .tab-count {
    background: rgba(255,255,255,0.3);
  }

  /* ===== Food Grid ===== */
  .food-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    max-height: 55vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 2px;
  }

  .food-grid::-webkit-scrollbar { width: 4px; }
  .food-grid::-webkit-scrollbar-track { background: transparent; }
  .food-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

  .food-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 6px 10px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    text-align: center;
    background: white;
    position: relative;
    min-height: 88px;
  }

  .food-item:active {
    transform: scale(0.95);
    background: #f0fdf4;
  }

  .food-item.selected {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .food-item.selected::after {
    content: '✓';
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    background: var(--primary);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
  }

  .food-item .emoji {
    font-size: 28px;
    margin-bottom: 4px;
    line-height: 1;
  }

  .food-item .name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .food-item .cal {
    font-size: 10px;
    color: var(--text-light);
    margin-top: 1px;
  }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 32px 16px;
    color: var(--text-light);
    font-size: 14px;
  }

  /* ===== Selected Food — Mobile Card Layout ===== */
  .selected-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sel-card {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    position: relative;
  }

  .sel-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .sel-card-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
  }

  .sel-card-name .emoji-sm {
    font-size: 24px;
  }

  .sel-card-remove {
    background: none;
    border: 2px solid transparent;
    color: var(--text-light);
    cursor: pointer;
    font-size: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    -webkit-appearance: none;
  }

  .sel-card-remove:active {
    background: var(--danger-light);
    color: var(--danger);
  }

  .sel-card-amount {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .sel-card-amount label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
    white-space: nowrap;
  }

  .sel-card-amount input {
    width: 80px;
    padding: 8px 10px;
    border: 2px solid var(--border);
    border-radius: var(--radius-xs);
    text-align: center;
    font-size: 16px; /* 防止 iOS 缩放 */
    font-weight: 700;
    outline: none;
    transition: all var(--transition);
    background: white;
    -webkit-appearance: none;
    appearance: none;
  }

  .sel-card-amount input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  .sel-card-amount .unit-label {
    font-size: 13px;
    color: var(--text-light);
  }

  .sel-card-nutrients {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .sel-nutrient {
    text-align: center;
    padding: 6px 4px;
    background: white;
    border-radius: var(--radius-xs);
    border: 1px solid #f1f5f9;
  }

  .sel-nutrient .n-val {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }

  .sel-nutrient .n-label {
    font-size: 10px;
    color: var(--text-light);
    margin-top: 1px;
  }

  .sel-nutrient.cal-highlight .n-val {
    color: var(--danger);
  }

  /* Desktop table (hidden on mobile) */
  .table-wrapper {
    overflow-x: auto;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    display: none; /* Hidden by default, shown on desktop */
  }

  .selected-list {
    width: 100%;
    border-collapse: collapse;
  }

  .selected-list th {
    text-align: left;
    padding: 12px 14px;
    background: #f8fafc;
    font-size: 12px;
    color: var(--text-light);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }

  .selected-list td {
    padding: 12px 14px;
    border-bottom: 1px solid #f1f5f9;
    font-size: 14px;
    vertical-align: middle;
  }

  .selected-list tbody tr:last-child td {
    border-bottom: none;
  }

  .food-name-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }

  .food-name-cell .emoji-sm {
    font-size: 20px;
  }

  .amount-input-desk {
    width: 76px;
    padding: 7px 10px;
    border: 2px solid var(--border);
    border-radius: var(--radius-xs);
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: all var(--transition);
    background: #f8fafc;
  }

  .amount-input-desk:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
    background: white;
  }

  .nutrient-val {
    font-weight: 600;
    font-size: 13px;
  }
  .nutrient-val .unit {
    color: var(--text-light);
    font-weight: 400;
    font-size: 11px;
  }

  .btn-remove-desk {
    background: none;
    border: 2px solid transparent;
    color: var(--text-light);
    cursor: pointer;
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }

  .btn-remove-desk:hover {
    background: var(--danger-light);
    color: var(--danger);
    border-color: var(--danger);
  }

  .empty-state {
    text-align: center;
    padding: 40px 16px;
  }

  .empty-state .empty-icon {
    font-size: 44px;
    margin-bottom: 10px;
  }

  .empty-state .empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .empty-state .empty-desc {
    font-size: 13px;
    color: var(--text-light);
  }

  /* ===== Add Form ===== */
  .add-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-items: end;
  }

  .add-form .form-full {
    grid-column: 1 / -1;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-group label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .form-group input {
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: var(--radius-xs);
    font-size: 16px; /* 防止 iOS 缩放 */
    outline: none;
    transition: all var(--transition);
    background: #f8fafc;
    -webkit-appearance: none;
    appearance: none;
  }

  .form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
    background: white;
  }

  .form-group input::placeholder {
    color: #cbd5e1;
  }

  .btn-add {
    padding: 11px 24px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    color: white;
    border: none;
    border-radius: var(--radius-xs);
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: all var(--transition);
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(245,158,11,0.3);
    grid-column: 1 / -1;
    -webkit-appearance: none;
    appearance: none;
  }

  .btn-add:active {
    transform: scale(0.98);
  }

  /* ===== Action Buttons ===== */
  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
    gap: 10px;
  }

  .btn-clear {
    padding: 10px 20px;
    background: white;
    color: var(--danger);
    border: 2px solid var(--danger);
    border-radius: var(--radius-xs);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: all var(--transition);
    -webkit-appearance: none;
    appearance: none;
  }

  .btn-clear:active {
    background: var(--danger);
    color: white;
  }

  /* ===== Progress Bar ===== */
  .calorie-progress {
    padding: 4px 0 0;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 8px;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .progress-track {
    height: 14px;
    background: #f1f5f9;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #10b981, #34d399);
    transition: width 0.5s ease;
    min-width: 0;
    max-width: 100%;
  }

  .progress-fill.warning {
    background: linear-gradient(90deg, #f59e0b, #fbbf24);
  }

  .progress-fill.over {
    background: linear-gradient(90deg, #ef4444, #f87171);
  }

  .macro-bars {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }

  .macro-bar-item {
    text-align: center;
  }

  .macro-bar-item .macro-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .mini-progress {
    height: 10px;
    background: #f1f5f9;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .mini-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  .mini-fill.protein { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .mini-fill.carbs   { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .mini-fill.fat     { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

  .macro-bar-item .macro-val {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .macro-bar-item .macro-val span {
    color: var(--text-light);
    font-weight: 400;
  }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    padding: 20px 16px;
    padding-bottom: calc(20px + var(--safe-bottom));
    color: var(--text-light);
    font-size: 11px;
    line-height: 1.5;
  }

  /* ============================
     Desktop (> 768px)
     ============================ */
  @media (min-width: 769px) {
    .container { padding: 0 20px 40px; }
    .card { padding: 28px; }

    .hero { padding: 48px 20px 60px; }
    .hero h1 { font-size: 36px; }

    .search-bar { max-width: 320px; }

    .card-header { flex-wrap: nowrap; }

    .summary-bar {
      padding: 20px 28px;
      gap: 16px;
    }
    .summary-item .value { font-size: 30px; }
    .summary-item .label { font-size: 12px; }

    .food-grid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 420px;
    }
    .food-item {
      padding: 14px 8px 12px;
      min-height: auto;
    }
    .food-item .emoji { font-size: 32px; }
    .food-item .name { font-size: 13px; }

    .food-item:hover {
      border-color: var(--primary);
      background: #f0fdf4;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16,185,129,0.15);
    }

    /* Desktop: show table, hide cards */
    .table-wrapper { display: block; }
    .selected-cards { display: none !important; }

    .add-form {
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 12px;
    }
    .add-form .form-full { grid-column: auto; }
    .btn-add { grid-column: auto; }

    .card:hover { box-shadow: var(--shadow-lg); }

    .btn-remove-desk:hover {
      background: var(--danger-light);
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-clear:hover {
      background: var(--danger);
      color: white;
    }

    .btn-add:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(245,158,11,0.4);
    }
  }

  /* ============================
     Small Phone (< 380px)
     ============================ */
  @media (max-width: 379px) {
    .hero h1 { font-size: 24px; }
    .hero p { font-size: 13px; }
    .container { padding: 0 10px 30px; }
    .card { padding: 14px; }

    .summary-bar {
      grid-template-columns: repeat(3, 1fr);

const dailyTarget = { calories: 2000, protein: 65, carbs: 300, fat: 60 };

function initFoods() {
  allFoods = [];
  categories = [];
  for (const [cat, foods] of Object.entries(foodDatabase)) {
    categories.push(cat);
    foods.forEach(f => allFoods.push({ ...f, category: cat }));
  }
}

function loadCustomFoods() {
  try {
    const saved = localStorage.getItem("customFoodsV2");
    if (saved) {
      const customs = JSON.parse(saved);
      customs.forEach(f => allFoods.push(f));
      const extraCats = [...new Set(customs.map(f => f.category))];
      extraCats.forEach(c => { if (!categories.includes(c)) categories.push(c); });
    }
  } catch(e) {}
}

function saveCustomFoods() {
  const dbCount = Object.values(foodDatabase).reduce((s, arr) => s + arr.length, 0);
  const customs = allFoods.slice(dbCount);
  localStorage.setItem("customFoodsV2", JSON.stringify(customs));
}

// ===== Category Tabs =====
function renderCategoryTabs() {
  const container = document.getElementById("categoryTabs");
  const allCount = getFilteredFoods("全部").length;
  let html = `<button class="tab-btn ${currentCategory === '全部' ? 'active' : ''}" onclick="setCategory('全部')">全部<span class="tab-count">${allCount}</span></button>`;
  categories.forEach(cat => {
    const count = getFilteredFoods(cat).length;
    if (count === 0) return;
    html += `<button class="tab-btn ${currentCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}<span class="tab-count">${count}</span></button>`;
  });
  container.innerHTML = html;

  // 自动滚动到选中的 tab
  requestAnimationFrame(() => {
    const activeTab = container.querySelector('.tab-btn.active');
    if (activeTab) {
      activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  });
}

function setCategory(cat) {
  currentCategory = cat;
  render();
}

function getFilteredFoods(cat) {
  let list = cat === "全部" ? allFoods : allFoods.filter(f => f.category === cat);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(f => f.name.toLowerCase().includes(q));
  }
  return list;
}

// ===== Food Grid =====
function renderFoodGrid() {
  const grid = document.getElementById("foodGrid");
  const filtered = getFilteredFoods(currentCategory);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">😅 没有找到匹配的食物</div>';
    return;
  }

  grid.innerHTML = "";
  filtered.forEach(food => {
    const globalIdx = allFoods.indexOf(food);
    const isSelected = selectedFoods.some(s => s.foodIdx === globalIdx);
    const div = document.createElement("div");
    div.className = "food-item" + (isSelected ? " selected" : "");
    div.onclick = () => toggleFood(globalIdx);
    div.innerHTML = `
      <span class="emoji">${food.emoji}</span>
      <div class="name" title="${food.name}">${food.name}</div>
      <div class="cal">${food.calories} kcal</div>
    `;
    grid.appendChild(div);
  });
}

function onSearch() {
  searchQuery = document.getElementById("searchInput").value.trim();
  renderCategoryTabs();
  renderFoodGrid();
}

function toggleFood(idx) {
  const existIdx = selectedFoods.findIndex(s => s.foodIdx === idx);
  if (existIdx >= 0) {
    selectedFoods.splice(existIdx, 1);
  } else {
    selectedFoods.push({ foodIdx: idx, amount: 100 });
  }
  render();
}

// ===== Selected List =====
function renderSelectedList() {
  const area = document.getElementById("selectedArea");
  const actions = document.getElementById("actionsArea");

  if (selectedFoods.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🍽️</div>
      <div class="empty-title">还没有添加食物</div>
      <div class="empty-desc">点击上方食物卡片开始记录</div>
    </div>`;
    actions.style.display = "none";
    return;
  }

  actions.style.display = "flex";

  // Mobile: card layout
  let cardsHtml = '<div class="selected-cards">';
  selectedFoods.forEach((item, i) => {
    const food = allFoods[item.foodIdx];
    const r = item.amount / 100;
    cardsHtml += `<div class="sel-card">
      <div class="sel-card-top">
        <div class="sel-card-name"><span class="emoji-sm">${food.emoji}</span>${food.name}</div>
        <button class="sel-card-remove" onclick="removeFood(${i})" aria-label="移除">✕</button>
      </div>
      <div class="sel-card-amount">
        <label>数量</label>
        <input type="number" inputmode="decimal" min="0" value="${item.amount}"
          onchange="updateAmount(${i}, this.value)"
          oninput="updateAmount(${i}, this.value)">
        <span class="unit-label">克</span>
      </div>
      <div class="sel-card-nutrients">
        <div class="sel-nutrient cal-highlight">
          <div class="n-val">${(food.calories * r).toFixed(0)}</div>
          <div class="n-label">热量 kcal</div>
        </div>
        <div class="sel-nutrient">
          <div class="n-val">${(food.protein * r).toFixed(1)}</div>
          <div class="n-label">蛋白质 g</div>
        </div>
        <div class="sel-nutrient">
          <div class="n-val">${(food.carbs * r).toFixed(1)}</div>
          <div class="n-label">碳水 g</div>
        </div>
        <div class="sel-nutrient">
          <div class="n-val">${(food.fat * r).toFixed(1)}</div>
          <div class="n-label">脂肪 g</div>
        </div>
      </div>
    </div>`;
  });
  cardsHtml += '</div>';

  // Desktop: table layout
  let tableHtml = `<div class="table-wrapper"><table class="selected-list">
    <thead><tr>
      <th>食物</th><th>数量 (g)</th><th>热量</th><th>蛋白质</th><th>碳水</th><th>脂肪</th><th></th>
    </tr></thead><tbody>`;
  selectedFoods.forEach((item, i) => {
    const food = allFoods[item.foodIdx];
    const r = item.amount / 100;
    tableHtml += `<tr>
      <td><div class="food-name-cell"><span class="emoji-sm">${food.emoji}</span>${food.name}</div></td>
      <td><input class="amount-input-desk" type="number" min="0" value="${item.amount}" onchange="updateAmount(${i}, this.value)" oninput="updateAmount(${i}, this.value)"></td>
      <td><span class="nutrient-val">${(food.calories * r).toFixed(0)} <span class="unit">kcal</span></span></td>
      <td><span class="nutrient-val">${(food.protein * r).toFixed(1)} <span class="unit">g</span></span></td>
      <td><span class="nutrient-val">${(food.carbs * r).toFixed(1)} <span class="unit">g</span></span></td>
      <td><span class="nutrient-val">${(food.fat * r).toFixed(1)} <span class="unit">g</span></span></td>
      <td><button class="btn-remove-desk" onclick="removeFood(${i})" title="移除">✕</button></td>
    </tr>`;
  });
  tableHtml += `</tbody></table></div>`;

  area.innerHTML = cardsHtml + tableHtml;
}

function updateAmount(i, val) {
  selectedFoods[i].amount = parseFloat(val) || 0;
  renderSelectedList();
  renderSummary();
}

function removeFood(i) {
  selectedFoods.splice(i, 1);
  render();
}

function clearAll() {
  if (!confirm("确定要清空所有已选食物吗？")) return;
  selectedFoods = [];
  render();
}

// ===== Summary =====
function renderSummary() {
  let totalCal = 0, totalPro = 0, totalCarb = 0, totalFat = 0, totalFib = 0;
  selectedFoods.forEach(item => {
    const food = allFoods[item.foodIdx];
    const r = item.amount / 100;
    totalCal  += food.calories * r;
    totalPro  += food.protein * r;
    totalCarb += food.carbs * r;
    totalFat  += food.fat * r;
    totalFib  += (food.fiber || 0) * r;
  });

  document.getElementById("totalCalories").textContent = totalCal.toFixed(0);
  document.getElementById("totalProtein").textContent  = totalPro.toFixed(1);
  document.getElementById("totalCarbs").textContent    = totalCarb.toFixed(1);
  document.getElementById("totalFat").textContent      = totalFat.toFixed(1);
  document.getElementById("totalFiber").textContent    = totalFib.toFixed(1);

  // Calorie progress
  const calPct = Math.min(totalCal / dailyTarget.calories * 100, 100);
  const calFill = document.getElementById("calorieFill");
  calFill.style.width = calPct + "%";
  calFill.className = "progress-fill" + (totalCal > dailyTarget.calories ? " over" : calPct > 80 ? " warning" : "");
  document.getElementById("calorieStatus").textContent = totalCal.toFixed(0) + " / " + dailyTarget.calories + " kcal";

  const proPct = Math.min(totalPro / dailyTarget.protein * 100, 100);
  document.getElementById("proteinFill").style.width = proPct + "%";
  document.getElementById("proteinStatus").innerHTML = totalPro.toFixed(1) + "g <span>/ " + dailyTarget.protein + "g</span>";

  const carbPct = Math.min(totalCarb / dailyTarget.carbs * 100, 100);
  document.getElementById("carbsFill").style.width = carbPct + "%";
  document.getElementById("carbsStatus").innerHTML = totalCarb.toFixed(1) + "g <span>/ " + dailyTarget.carbs + "g</span>";

  const fatPct = Math.min(totalFat / dailyTarget.fat * 100, 100);
  document.getElementById("fatFill").style.width = fatPct + "%";
  document.getElementById("fatStatus").innerHTML = totalFat.toFixed(1) + "g <span>/ " + dailyTarget.fat + "g</span>";
}

// ===== Add Custom Food =====
function addCustomFood() {
  const name     = document.getElementById("customName").value.trim();
  const calories = parseFloat(document.getElementById("customCalories").value);
  const protein  = parseFloat(document.getElementById("customProtein").value) || 0;
  const carbs    = parseFloat(document.getElementById("customCarbs").value) || 0;
  const fat      = parseFloat(document.getElementById("customFat").value) || 0;

  if (!name) { alert("请输入食物名称"); return; }
  if (isNaN(calories) || calories <= 0) { alert("请输入有效的热量值"); return; }

  const newFood = { name, emoji: "🍽️", calories, protein, carbs, fat, fiber: 0, category: "自定义" };
  allFoods.push(newFood);
  if (!categories.includes("自定义")) categories.push("自定义");
  saveCustomFoods();
  selectedFoods.push({ foodIdx: allFoods.length - 1, amount: 100 });

  document.getElementById("customName").value = "";
  document.getElementById("customCalories").value = "";
  document.getElementById("customProtein").value = "";
  document.getElementById("customCarbs").value = "";
  document.getElementById("customFat").value = "";

  // 收起键盘
  document.activeElement.blur();
  render();
}

function render() {
  renderCategoryTabs();
  renderFoodGrid();
  renderSelectedList();
  renderSummary();
}

// ===== Init =====
initFoods();
loadCustomFoods();
render();

// 微信浏览器中禁止弹性滚动导致整页下拉
document.body.addEventListener('touchmove', function(e) {}, { passive: true });
</script>
